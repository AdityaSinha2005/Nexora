<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <!-- Left Ribbon Gradient -->
    <linearGradient id="nLeftRibbon" x1="8" y1="40" x2="20" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="40%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Diagonal Ribbon Gradient -->
    <linearGradient id="nDiagRibbon" x1="16" y1="12" x2="34" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Right Ribbon Gradient -->
    <linearGradient id="nRightRibbon" x1="28" y1="36" x2="40" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <!-- Cosmic Orbit Arc Gradient -->
    <linearGradient id="nOrbitGrad" x1="6" y1="38" x2="44" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset="35%" stop-color="#14B8A6" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F0FDF4" stop-opacity="1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="nSubtleGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Logo -->
  <circle cx="24" cy="24" r="18" fill="#14B8A6" opacity="0.12" filter="url(#nSubtleGlow)"/>

  <!-- Cosmic Swoop Orbit Arc -->
  <path d="M 7 34.5 C 10 40 22 43 32 37.5 C 37 34.5 41 29 42 22 C 42.5 17.5 40 12 37 10" 
        stroke="url(#nOrbitGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Left Upright Ribbon Segment (Curved smooth fold) -->
  <path d="M 12 38 C 10.5 38 9.5 36.5 10.2 35.1 L 18.5 14.5 C 19.3 12.5 21.6 11.2 23.8 11.8 C 25.4 12.3 26.5 13.8 26.5 15.5 L 26.5 24 L 16.5 37.2 C 15.4 37.8 13.7 38 12 38 Z" 
        fill="url(#nLeftRibbon)"/>

  <!-- Diagonal Folding Ribbon Segment -->
  <path d="M 23.5 12 C 25 12.5 26.5 14 26.5 16 L 26.5 27 L 34.8 36.5 C 35.8 37.6 37.4 38 38.8 37.2 C 37.5 38 35.5 38 34.2 36.8 L 19.2 19 L 23.5 12 Z" 
        fill="url(#nDiagRibbon)" opacity="0.95"/>

  <!-- Right Upright Ribbon Segment -->
  <path d="M 33 37 C 31.8 37 31 35.8 31.5 34.6 L 37.8 16.2 C 38.5 14.2 40.5 12.8 42.7 13.2 C 44 13.5 44.8 14.8 44.5 16.1 L 39.5 35 C 39 36.5 37.2 37 35.5 37 L 33 37 Z" 
        fill="url(#nRightRibbon)"/>

  <!-- 3D Geometric Ribbon N Shape -->
  <path d="M 11.5 37 C 10.2 37 9.5 35.8 10 34.5 L 18.2 14.8 C 19.2 12.4 21.8 11 24.3 11.8 C 26.2 12.5 27.5 14.2 27.5 16.2 L 27.5 24.8 L 36.2 35.8 C 37.2 37 38.8 37.2 40 36.5 L 40.2 36.3 C 38.8 37.8 36.8 38 35 36.8 L 25 24.5 L 25 16 C 25 14.8 24 13.8 22.8 13.5 C 21.2 13 19.6 14 19 15.5 L 12.5 35.5 C 12.3 36.2 11.9 37 11.5 37 Z" 
        fill="#38BDF8" opacity="0.3" blend-mode="overlay"/>

  <!-- Main Pure Ribbon Stroke Definition for crispness -->
  <!-- Facet 1: Ascending Left Fold -->
  <path d="M 12 36.5 C 10.8 36.5 10 35.4 10.5 34.2 L 18 16 C 18.8 13.8 21 12.2 23.4 12.5 C 25.2 12.7 26.5 14.2 26.5 16 L 26.5 22 L 15.5 36.2 C 14.5 36.5 13.2 36.5 12 36.5 Z" 
        fill="url(#nLeftRibbon)"/>

  <!-- Facet 2: Crossing Diagonal Ribbon -->
  <path d="M 23.5 12.6 C 24.8 13.2 26.5 14.5 26.5 16.5 L 26.5 24.5 L 36 36.2 C 34.8 36.8 33.2 36.5 32.2 35.2 L 20.5 20.8 L 23.5 12.6 Z" 
        fill="url(#nDiagRibbon)"/>

  <!-- Facet 3: Ascending Right Ribbon -->
  <path d="M 32 35.5 L 38 17 C 38.6 15 40.5 13.5 42.6 13.8 C 43.8 14 44.5 15.2 44.2 16.5 L 38.8 35 C 38.2 36.5 36.6 37 35 37 C 33.8 37 32.6 36.4 32 35.5 Z" 
        fill="url(#nRightRibbon)"/>

  <!-- Apex Star Sparkle -->
  <path d="M 43.5 9 C 43.5 11 44.5 12 46.5 12 C 44.5 12 43.5 13 43.5 15 C 43.5 13 42.5 12 40.5 12 C 42.5 12 43.5 11 43.5 9 Z" 
        fill="#FFFFFF"/>
  <circle cx="43.5" cy="12" r="1" fill="#BAE6FD" filter="url(#nSubtleGlow)"/>
</svg>